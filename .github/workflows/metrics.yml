name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    name: generate-metrics
    timeout-minutes: 20
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9 }
            h1, h2, h3, a { color: #58a6ff }
            .field, .row, .contrib, small { color: #c9d1d9 }
            .repository .description, .repository .infos, .cakeday { color: #8b949e }

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          config_timezone: Europe/Paris
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9 }
            h1, h2, h3, a { color: #58a6ff }
            .field, .row, .contrib, small { color: #c9d1d9 }
            .repository .description, .repository .infos, .cakeday { color: #8b949e }

      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/calendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Paris
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9 }
            h1, h2, h3, a { color: #58a6ff }
            .field, .row, .contrib, small { color: #c9d1d9 }
            .repository .description, .repository .infos, .cakeday { color: #8b949e }
